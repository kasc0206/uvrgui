[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ultimatevocalremovergui"
version = "5.6.0"
description = "终极人声移除图形界面 — AI 音频源分离工具"
readme = "README_zh.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anjok07", email = "noreply@github.com"},
    {name = "aufr33"},
]
keywords = ["audio", "separation", "vocal-removal", "music", "deep-learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "audioread>=3.0.0",
    "diffq>=0.2.0",
    "einops>=0.6.0",
    "julius>=0.2.0",
    "kthread>=0.2.0",
    "librosa>=0.9.0",
    "matchering>=2.0.0",
    "ml_collections>=0.1.0",
    "natsort>=8.2.0",
    "omegaconf>=2.2.0",
    "opencv-python>=4.6.0",
    "Pillow>=9.3.0",
    "playsound3>=3.3.0",
    "psutil>=5.9.0",
    "pydub>=0.25.0",
    "pyglet>=1.5.0",
    "pyperclip>=1.8.0",
    "pytorch-lightning>=2.0.0",
    "PyYAML>=6.0",
    "soundfile>=0.13.0",
    "scipy>=1.9.0",
    "torch>=2.0.0",
    "tqdm>=4.67.0",
    "wget>=3.2",
]

[project.urls]
Homepage = "https://github.com/kasc0206/uvrgui"
Repository = "https://github.com/kasc0206/uvrgui.git"
"Bug Tracker" = "https://github.com/kasc0206/uvrgui/issues"
Original = "https://github.com/Anjok07/ultimatevocalremovergui"

[project.scripts]
uvr = "uvr_cli:main"

[tool.setuptools]
packages = []
include-package-data = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "tests/*", "htmlcov/*", ".pytest_cache/*"]
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if TYPE_CHECKING:",
]
