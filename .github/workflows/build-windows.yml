name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          choco install ffmpeg -y
          python --version
        shell: powershell

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install setuptools (provides pkg_resources for librosa)
        run: |
          pip install setuptools
          python -c "import pkg_resources; print('pkg_resources OK')"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install CUDA PyTorch (optional, for GPU acceleration)
        run: |
          pip install --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Verify imports
        run: |
          python -c "
          import tkinter
          import torch
          import librosa
          import soundfile
          import numpy
          import demucs
          import gui_data.constants
          print('All imports OK')
          "

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller UVR.spec --clean --noconfirm

      - name: Verify build output
        run: |
          if (Test-Path "dist/UVR.exe") {
            $size = (Get-Item "dist/UVR.exe").Length
            Write-Host "EXE size: $([math]::Round($size / 1MB, 2)) MB"
          } else {
            Write-Error "UVR.exe not found in dist/"
            exit 1
          }

      - name: Create distributable archive
        run: |
          # Copy additional runtime files
          Copy-Item "README.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "README_zh.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "dist/" -ErrorAction SilentlyContinue

          # Create zip archive (use 7z to handle files >2GB)
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "v1.0.0" }
          $zipName = "UVR_${version}_Windows_x86_64.zip"
          7z a -mx=5 "$zipName" ".\dist\*"
          Write-Host "Archive created: $zipName"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVR-Windows-x86_64
          path: UVR_*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UVR_*.zip
          generate_release_notes: true
          body: |
            ## Ultimate Vocal Remover GUI — Windows Build

            Auto-built from commit ${{ github.sha }}

            ### 安装说明
            1. 下载 `UVR_*.zip`
            2. 解压到任意目录
            3. 运行 `UVR.exe`

            > 首次启动可能需要 5-10 分钟（模型初始化）
