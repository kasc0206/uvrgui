name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          choco install ffmpeg -y
          python --version
        shell: powershell

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install setuptools (provides pkg_resources for librosa)
        run: |
          pip install setuptools
          python -c "import pkg_resources; print('pkg_resources OK')"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Verify imports (CPU)
        run: |
          python -c "
          import tkinter; import torch; import librosa
          import soundfile; import numpy; import demucs
          import gui_data.constants
          print('CPU torch OK:', torch.backends.mps.is_available() if hasattr(torch.backends, 'mps') else 'N/A')
          "

      # ──────────── CPU Build ────────────
      - name: Build EXE (CPU)
        run: |
          pyinstaller UVR.spec --clean --noconfirm
          $size = (Get-Item "dist/UVR.exe").Length
          Write-Host "CPU EXE size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Package CPU ZIP
        run: |
          Copy-Item "README.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "README_zh.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "dist/" -ErrorAction SilentlyContinue
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "v1.0.0" }
          $zipName = "UVR_${version}_Windows_x86_64_CPU.zip"
          7z a -mx=5 "$zipName" ".\dist\*"
          Write-Host "CPU archive: $zipName"

      - name: Upload CPU artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVR-Windows-x86_64-CPU
          path: UVR_*_CPU.zip
          retention-days: 30

      # ──────────── CUDA Build ────────────
      - name: Install CUDA PyTorch
        run: |
          pip install --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121

      - name: Verify imports (CUDA)
        run: |
          python -c "
          import torch; print('CUDA available:', torch.cuda.is_available())
          import tkinter; import librosa; import soundfile; import numpy
          import demucs; import gui_data.constants
          print('CUDA imports OK')
          "

      - name: Rebuild EXE (CUDA)
        run: |
          pyinstaller UVR.spec --clean --noconfirm
          $size = (Get-Item "dist/UVR.exe").Length
          Write-Host "CUDA EXE size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Package CUDA ZIP
        run: |
          Copy-Item "README.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "README_zh.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "dist/" -ErrorAction SilentlyContinue
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "v1.0.0" }
          $zipName = "UVR_${version}_Windows_x86_64_CUDA.zip"
          7z a -mx=5 "$zipName" ".\dist\*"
          Write-Host "CUDA archive: $zipName"

      - name: Upload CUDA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVR-Windows-x86_64-CUDA
          path: UVR_*_CUDA.zip
          retention-days: 30

      # ──────────── Release ────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: UVR_*_CPU.zip
          generate_release_notes: true
          body: |
            ## Ultimate Vocal Remover GUI v${{ github.ref_name }}

            ### 📥 下载

            **CPU 版**（~400 MB，通用兼容）— 已附件在本 Release 中 👇

            **CUDA 版**（~2.5 GB，NVIDIA GPU 加速）— 请从 Actions Artifact 下载：
            https://github.com/kasc0206/uvrgui/actions/runs/${{ github.run_id }}

            ### 🏗️ 本机构建
            ```bash
            git clone https://github.com/kasc0206/uvrgui.git
            cd uvrgui
            pip install -r requirements.txt
            pip install pyinstaller
            pyinstaller UVR.spec --clean --noconfirm
            ```

            ### ✅ 构建信息
            - 提交: `${{ github.sha }}`
            - CPU 版: CPU-only PyTorch
            - CUDA 版: CUDA 12.1 PyTorch

            进入链接后，点击 Artifacts → 下载 `UVR-Windows-x86_64.zip`。

            ### 🏗️ 本机构建 CPU 版（~400 MB）
            ```bash
            pip install -r requirements.txt
            pip install pyinstaller
            pyinstaller UVR.spec --clean --noconfirm
            ```

            ### ✅ 构建信息
            - 提交: ${{ github.sha }}

            Auto-built from commit ${{ github.sha }}

            ### 安装说明
            1. 下载 `UVR_*.zip`
            2. 解压到任意目录
            3. 运行 `UVR.exe`

            > 首次启动可能需要 5-10 分钟（模型初始化）
