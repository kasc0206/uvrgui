name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.0.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          choco install ffmpeg -y
          python --version
        shell: powershell

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install setuptools (provides pkg_resources for librosa)
        run: |
          pip install setuptools
          python -c "import pkg_resources; print('pkg_resources OK')"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install PyInstaller
        run: |
          pip install pyinstaller

      - name: Verify imports (CPU)
        run: |
          python -c "
          import tkinter; import torch; import librosa
          import soundfile; import numpy; import demucs
          import gui_data.constants
          print('CPU torch OK:', torch.backends.mps.is_available() if hasattr(torch.backends, 'mps') else 'N/A')
          "

      # ──────────── CPU Build ────────────
      - name: Build EXE (CPU)
        run: |
          pyinstaller UVR.spec --clean --noconfirm
          $size = (Get-Item "dist/UVR.exe").Length
          Write-Host "CPU EXE size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Package CPU ZIP
        run: |
          Copy-Item "README.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "dist/" -ErrorAction SilentlyContinue
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "v1.0.0" }
          $zipName = "UVR_${version}_Windows_x86_64_CPU.zip"
          7z a -mx=5 "$zipName" ".\dist\*"
          Write-Host "CPU archive: $zipName"

      - name: Upload CPU artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVR-Windows-x86_64-CPU
          path: UVR_*_CPU.zip
          retention-days: 30

      # ──────────── CUDA Build ────────────
      - name: Install CUDA PyTorch
        run: |
          pip install --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121

      - name: Verify imports (CUDA)
        run: |
          python -c "
          import torch; print('CUDA available:', torch.cuda.is_available())
          import tkinter; import librosa; import soundfile; import numpy
          import demucs; import gui_data.constants
          print('CUDA imports OK')
          "

      - name: Rebuild EXE (CUDA)
        run: |
          pyinstaller UVR.spec --clean --noconfirm
          $size = (Get-Item "dist/UVR.exe").Length
          Write-Host "CUDA EXE size: $([math]::Round($size / 1MB, 2)) MB"

      - name: Package CUDA ZIP
        run: |
          Copy-Item "README.md" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "dist/" -ErrorAction SilentlyContinue
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "v1.0.0" }
          $zipName = "UVR_${version}_Windows_x86_64_CUDA.zip"
          7z a -mx=5 "$zipName" ".\dist\*"
          Write-Host "CUDA archive: $zipName"

      - name: Upload CUDA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVR-Windows-x86_64-CUDA
          path: UVR_*_CUDA.zip
          retention-days: 30

      # ──────────── Release (Primary) ────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UVR_*_CPU.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Ultimate Vocal Remover GUI ${{ github.ref_name }}

            ### 📥 下载

            | 平台 (Platform) | 变体 (Variant) | 文件 (File) | GPU |
            |:---|:---|:---|:---:|
            | 🪟 Windows | CPU | `UVR_*_Windows_x86_64_CPU.zip` | ❌ |
            | 🪟 Windows | CUDA | `UVR_*_Windows_x86_64_CUDA.zip` | ✅ NVIDIA |
            | 🍎 macOS | Universal | `UVR_*_macOS_*.zip` | ✅ MPS |
            | 🐧 Linux | CPU | `UVR_*_Linux_x86_64.tar.gz` | ❌ |
            | 🐧 Linux | CUDA | `UVR_*_Linux_x86_64_CUDA.tar.gz` | ✅ NVIDIA |

            **CPU 版**（~400 MB，通用兼容）— 已附件在本 Release 中 👇

            > **CUDA 版**（~2.5 GB，NVIDIA GPU 加速）超过 GitHub 2GB 文件限制，
            > 请从 Actions Artifact 手动下载：
            > <https://github.com/kasc0206/uvrgui/actions/workflows/build-windows.yml>
            > <https://github.com/kasc0206/uvrgui/actions/workflows/build-linux.yml>
            > macOS 和 Linux 构建产物由并行 workflow 自动附加到本 Release。
            ```bash
            git clone https://github.com/kasc0206/uvrgui.git
            cd uvrgui
            pip install -r requirements.txt
            pip install pyinstaller
            pyinstaller UVR.spec --clean --noconfirm
            ```
